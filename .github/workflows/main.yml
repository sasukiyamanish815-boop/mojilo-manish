name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Mojilo Manish ZIP
        run: |
          rm -rf app-source
          mkdir app-source
          unzip -q "mojilo-manish-supabase-ready.zip" -d app-source

      - name: Check extracted project
        run: |
          echo "Extracted files:"
          ls -la app-source
          echo "App folder:"
          ls -la app-source/app

      - name: Create debug keystore
        working-directory: app-source
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: app-source
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
